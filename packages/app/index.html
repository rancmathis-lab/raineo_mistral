<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Rainéo</title>
  <style>
    :root { --bg: #1e1e1e; --panel: #252526; --accent: #4da3ff; --fg: #cccccc; }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); font-size: 13px; }
    button { background: #333; color: var(--fg); border: 1px solid #444; border-radius: 3px; padding: 3px 10px; cursor: pointer; }
    button:hover { background: #3e3e3e; }
    button.active { background: var(--accent); color: #000; }
    input[type=text], input[type=number] { background: #333; border: 1px solid #444; color: var(--fg); border-radius: 3px; padding: 2px 6px; width: 100px; }
    .app { display: flex; flex-direction: column; height: 100%; }
    .menubar { display: flex; gap: 8px; padding: 4px 10px; background: var(--panel); border-bottom: 1px solid #333; }
    .toolbar { display: flex; gap: 4px; padding: 4px 10px; background: var(--panel); border-bottom: 1px solid #333; }
    .main { display: flex; flex: 1; min-height: 0; }
    .sidepanel { width: 240px; background: var(--panel); border-left: 1px solid #333; padding: 8px; overflow-y: auto; }
    .sidepanel h3 { margin: 10px 0 6px; font-size: 12px; text-transform: uppercase; color: #999; }
    .canvaswrap { flex: 1; position: relative; min-width: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
    .statusbar { padding: 3px 10px; background: var(--panel); border-top: 1px solid #333; font-size: 12px; color: #888; }
    .layer-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .layer-row span { flex: 1; }
    .layer-row.active-layer { color: var(--accent); }
    .section { margin-bottom: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</html>
